# DR Backup/Restore environment values (vm-dr-backup)
# Similar to Pattern A, the standby target does not deploy the VM locally (Trident Protect's BackupRestore recreates it upon execution).
vm:
  enabled: false

storage:
  storageClass: storage-class-iscsi
  accessMode: ReadWriteMany
  volumeMode: Block
  size: 30Gi

trident:
  appName: centos-vm-app-backup
  amr:
    enabled: false

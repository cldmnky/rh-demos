<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
  <defs>
    <filter id="chalk">
      <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#111" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#151515"/>
    </linearGradient>
    <marker id="arrowW" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#ccc"/>
    </marker>
    <marker id="arrowG" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" fill="url(#bgGrad)" rx="8"/>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="17" font-weight="bold" filter="url(#chalk)">Act 1 — S3 Cloud Backup &amp; Restore (Pattern B) — Data Flow</text>
  <line x1="200" y1="43" x2="760" y2="43" stroke="#555" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- === STEP 1: Production VM === -->
  <rect x="30" y="65" width="190" height="75" fill="none" stroke="#aaa" stroke-width="2" rx="5" filter="url(#chalk)"/>
  <rect x="30" y="65" width="190" height="22" fill="#222" rx="5"/>
  <text x="125" y="80" text-anchor="middle" fill="#8cf" font-family="monospace" font-size="10" font-weight="bold">① Production VM</text>
  <text x="125" y="98" text-anchor="middle" fill="#ddd" font-family="monospace" font-size="9">CentOS VM (Blue)</text>
  <text x="125" y="113" text-anchor="middle" fill="#999" font-family="monospace" font-size="8">namespace: vm-prod</text>
  <text x="125" y="128" text-anchor="middle" fill="#999" font-family="monospace" font-size="8">PVC: 30GB iSCSI</text>

  <!-- Arrow: VM -> Trident -->
  <line x1="220" y1="100" x2="280" y2="140" stroke="#ccc" stroke-width="2.5" marker-end="url(#arrowW)"/>
  <text x="235" y="115" fill="#aaa" font-family="monospace" font-size="7">ExecHook</text>
  <text x="235" y="126" fill="#aaa" font-family="monospace" font-size="7">freeze</text>

  <!-- === STEP 2: Trident Protect + ExecHook === -->
  <rect x="280" y="65" width="220" height="110" fill="none" stroke="#aaa" stroke-width="2" rx="5" filter="url(#chalk)"/>
  <rect x="280" y="65" width="220" height="24" fill="#222" rx="5"/>
  <text x="390" y="80" text-anchor="middle" fill="#dfa" font-family="monospace" font-size="10" font-weight="bold">② Trident Protect + ExecHook</text>
  <text x="390" y="102" text-anchor="middle" fill="#ddd" font-family="monospace" font-size="8">1. Execute Freeze Hook → quiesce FS</text>
  <text x="390" y="114" text-anchor="middle" fill="#ddd" font-family="monospace" font-size="8">2. Take CSI Storage Snapshot</text>
  <text x="390" y="126" text-anchor="middle" fill="#ddd" font-family="monospace" font-size="8">3. Execute Thaw Hook → resume I/O</text>
  <text x="390" y="140" text-anchor="middle" fill="#6af" font-family="monospace" font-size="8" font-weight="bold">✓ Point-in-time, app-consistent snapshot</text>

  <!-- Arrow: Trident -> Kopia -->
  <line x1="500" y1="140" x2="560" y2="180" stroke="#ccc" stroke-width="2.5" marker-end="url(#arrowW)"/>
  <text x="515" y="155" fill="#aaa" font-family="monospace" font-size="7">stream snapshot</text>
  <text x="515" y="166" fill="#aaa" font-family="monospace" font-size="7">blocks + metadata</text>

  <!-- === STEP 3: Kopia Data Mover === -->
  <rect x="560" y="65" width="180" height="110" fill="none" stroke="#aaa" stroke-width="2" rx="5" filter="url(#chalk)"/>
  <rect x="560" y="65" width="180" height="24" fill="#222" rx="5"/>
  <text x="650" y="80" text-anchor="middle" fill="#dfa" font-family="monospace" font-size="10" font-weight="bold">③ Kopia Engine</text>
  <text x="650" y="102" text-anchor="middle" fill="#ddd" font-family="monospace" font-size="8">Pack &amp; deduplicate blocks</text>
  <text x="650" y="114" text-anchor="middle" fill="#ddd" font-family="monospace" font-size="8">Encrypt with AES-256-GCM</text>
  <text x="650" y="126" text-anchor="middle" fill="#ddd" font-family="monospace" font-size="8">Split into content-addressable</text>
  <text x="650" y="138" text-anchor="middle" fill="#ddd" font-family="monospace" font-size="8">chunks for streaming</text>

  <!-- Arrow: Kopia -> S3 -->
  <line x1="740" y1="140" x2="790" y2="180" stroke="#ccc" stroke-width="2.5" marker-end="url(#arrowW)"/>
  <text x="750" y="155" fill="#aaa" font-family="monospace" font-size="7">HTTPS upload</text>

  <!-- === STEP 4: S3 AppVault === -->
  <rect x="790" y="65" width="150" height="110" fill="none" stroke="#aaa" stroke-width="2" rx="5" filter="url(#chalk)"/>
  <rect x="790" y="65" width="150" height="24" fill="#222" rx="5"/>
  <text x="865" y="80" text-anchor="middle" fill="#dfa" font-family="monospace" font-size="10" font-weight="bold">④ AWS S3 AppVault</text>
  <text x="865" y="102" text-anchor="middle" fill="#ddd" font-family="monospace" font-size="8">lab-vault</text>
  <text x="865" y="116" text-anchor="middle" fill="#999" font-family="monospace" font-size="8">Encrypted blobs</text>
  <text x="865" y="128" text-anchor="middle" fill="#999" font-family="monospace" font-size="8">Kubernetes metadata</text>
  <text x="865" y="142" text-anchor="middle" fill="#6af" font-family="monospace" font-size="8" font-weight="bold">~14 min for 30GB</text>

  <!-- === STEP 5: BackupRestore === -->
  <rect x="790" y="220" width="150" height="110" fill="none" stroke="#ccc" stroke-width="2" rx="5" filter="url(#chalk)"/>
  <rect x="790" y="220" width="150" height="24" fill="#222" rx="5"/>
  <text x="865" y="235" text-anchor="middle" fill="#fda" font-family="monospace" font-size="10" font-weight="bold">⑤ BackupRestore CR</text>
  <text x="865" y="255" text-anchor="middle" fill="#ddd" font-family="monospace" font-size="8">Pipeline submits</text>
  <text x="865" y="267" text-anchor="middle" fill="#ddd" font-family="monospace" font-size="8">BackupRestore to</text>
  <text x="865" y="279" text-anchor="middle" fill="#ddd" font-family="monospace" font-size="8">vm-dr-backup ns</text>
  <text x="865" y="295" text-anchor="middle" fill="#6af" font-family="monospace" font-size="8" font-weight="bold">Pull blocks from S3</text>

  <!-- Arrow: S3 -> BackupRestore -->
  <line x1="855" y1="180" x2="855" y2="220" stroke="#ccc" stroke-width="2.5" marker-end="url(#arrowW)"/>

  <!-- Arrow: BackupRestore -> Restored VM -->
  <line x1="790" y1="290" x2="650" y2="380" stroke="#ccc" stroke-width="2.5" marker-end="url(#arrowW)"/>
  <text x="735" y="340" fill="#aaa" font-family="monospace" font-size="7">Reconstruct PVCs</text>
  <text x="735" y="352" fill="#aaa" font-family="monospace" font-size="7">and VM manifests</text>

  <!-- === STEP 6: Restored VM === -->
  <rect x="280" y="380" width="370" height="90" fill="none" stroke="#ddd" stroke-width="2.5" rx="5" filter="url(#chalk)"/>
  <rect x="280" y="380" width="370" height="24" fill="#222" rx="5"/>
  <text x="465" y="395" text-anchor="middle" fill="#8cf" font-family="monospace" font-size="10" font-weight="bold">⑥ Restored VM — vm-dr-backup namespace</text>
  <text x="465" y="415" text-anchor="middle" fill="#ddd" font-family="monospace" font-size="9">Trident Protect recreates PVCs from S3 blocks</text>
  <text x="465" y="430" text-anchor="middle" fill="#ddd" font-family="monospace" font-size="9">→ re-deploys KubeVirt Datavolumes → boots CentOS VM</text>
  <text x="465" y="450" text-anchor="middle" fill="#6af" font-family="monospace" font-size="9" font-weight="bold">✓ Production replica, fully recovered from offsite S3</text>

  <!-- === TIMELINE BAR === -->
  <rect x="30" y="500" width="900" height="35" fill="none" stroke="#444" stroke-width="1" rx="4"/>
  <text x="50" y="510" fill="#6af" font-family="monospace" font-size="9" font-weight="bold">Timeline</text>
  <text x="110" y="510" fill="#aaa" font-family="monospace" font-size="8">Freeze &amp; Snap</text>
  <text x="220" y="510" fill="#aaa" font-family="monospace" font-size="8">Thaw</text>
  <text x="330" y="510" fill="#aaa" font-family="monospace" font-size="8">Kopia upload to S3 (streaming)</text>
  <text x="530" y="510" fill="#aaa" font-family="monospace" font-size="8">BackupRestore collects from S3</text>
  <text x="730" y="510" fill="#aaa" font-family="monospace" font-size="8">VM boots in DR namespace</text>
  <line x1="100" y1="522" x2="790" y2="522" stroke="#666" stroke-width="2"/>
  <rect x="100" y="518" width="6" height="8" fill="#aaa"/>
  <rect x="210" y="518" width="6" height="8" fill="#aaa"/>
  <rect x="520" y="518" width="6" height="8" fill="#aaa"/>
  <rect x="780" y="518" width="6" height="8" fill="#aaa"/>

  <!-- Footer -->
  <text x="480" y="552" text-anchor="middle" fill="#444" font-family="monospace" font-size="8" filter="url(#chalk)">AI Prompt: "hand-drawn technical illustration chalk-on-blackboard style, black background, monochrome white and grey ink only, no color — Act 1 S3 backup and restore data flow: Production VM → Trident Protect ExecHook freeze → CSI Snapshot → Kopia encryption/dedup → AWS S3 AppVault → BackupRestore CR → restored VM in vm-dr-backup namespace, with timeline bar"</text>
</svg>

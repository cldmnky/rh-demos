<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 680" width="1024" height="680">
  <defs>
    <filter id="rough">
      <feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="chalk">
      <feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#222" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="680" fill="url(#bgGrad)" rx="8"/>

  <!-- Title -->
  <text x="512" y="35" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="18" font-weight="bold" filter="url(#chalk)">GitOps-Driven Disaster Recovery Architecture</text>
  <line x1="200" y1="48" x2="824" y2="48" stroke="#555" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- === PRODUCTION ZONE (vm-prod) === -->
  <rect x="30" y="70" width="400" height="280" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="8,4" rx="6"/>
  <text x="40" y="90" fill="#888" font-family="monospace" font-size="11" font-weight="bold" filter="url(#chalk)">Production — Namespace 'vm-prod'</text>

  <!-- Git Repository -->
  <rect x="60" y="110" width="130" height="50" fill="none" stroke="#aaa" stroke-width="2" rx="4" filter="url(#chalk)"/>
  <text x="125" y="128" text-anchor="middle" fill="#ddd" font-family="monospace" font-size="11" font-weight="bold">⬡ Git Repo</text>
  <text x="125" y="145" text-anchor="middle" fill="#999" font-family="monospace" font-size="9">Helm Chart + Values</text>

  <!-- ArgoCD -->
  <rect x="220" y="110" width="170" height="50" fill="none" stroke="#aaa" stroke-width="2" rx="4" filter="url(#chalk)"/>
  <text x="305" y="128" text-anchor="middle" fill="#ddd" font-family="monospace" font-size="11" font-weight="bold">⎈ ArgoCD</text>
  <text x="305" y="145" text-anchor="middle" fill="#999" font-family="monospace" font-size="9">trident-dr-prod</text>

  <!-- Arrow: Git -> ArgoCD -->
  <line x1="195" y1="135" x2="215" y2="135" stroke="#aaa" stroke-width="2" marker-end="url(#arrowWhite)"/>
  <defs><marker id="arrowWhite" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#aaa"/></marker></defs>

  <!-- Tekton -->
  <rect x="230" y="175" width="150" height="45" fill="none" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#chalk)"/>
  <text x="305" y="191" text-anchor="middle" fill="#ddd" font-family="monospace" font-size="11" font-weight="bold">⚙ Tekton Pipelines</text>
  <text x="305" y="207" text-anchor="middle" fill="#999" font-family="monospace" font-size="9">Install · Upgrade · DR</text>

  <!-- ArgoCD -> Tekton arrow -->
  <line x1="305" y1="162" x2="305" y2="175" stroke="#aaa" stroke-width="1" marker-end="url(#arrowWhite)"/>

  <!-- VM Blue -->
  <rect x="60" y="240" width="140" height="60" fill="none" stroke="#ddd" stroke-width="2" rx="5" filter="url(#chalk)"/>
  <rect x="60" y="240" width="140" height="22" fill="#334" rx="5"/>
  <text x="130" y="254" text-anchor="middle" fill="#8cf" font-family="monospace" font-size="10" font-weight="bold">🖥 CentOS VM Blue</text>
  <text x="130" y="275" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="11" font-weight="bold">v1.0 · Active</text>
  <text x="130" y="292" text-anchor="middle" fill="#999" font-family="monospace" font-size="9">Running</text>

  <!-- VM Green -->
  <rect x="230" y="240" width="150" height="60" fill="none" stroke="#777" stroke-width="1.5" rx="5" filter="url(#chalk)"/>
  <rect x="230" y="240" width="150" height="22" fill="#1a1a2e" rx="5"/>
  <text x="305" y="254" text-anchor="middle" fill="#6af" font-family="monospace" font-size="10" font-weight="bold">🖥 CentOS VM Green</text>
  <text x="305" y="275" text-anchor="middle" fill="#999" font-family="monospace" font-size="11">v2.0 · Standby</text>
  <text x="305" y="292" text-anchor="middle" fill="#666" font-family="monospace" font-size="9">Stopped</text>

  <!-- ArgoCD -> VMs -->
  <line x1="270" y1="165" x2="130" y2="250" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrowWhite)"/>
  <text x="185" y="200" fill="#777" font-family="monospace" font-size="8">Deploys</text>
  <line x1="320" y1="165" x2="305" y2="250" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrowWhite)"/>
  <text x="340" y="210" fill="#777" font-family="monospace" font-size="8">Deploys</text>

  <!-- Trident Protect Application -->
  <rect x="60" y="320" width="200" height="40" fill="none" stroke="#aaa" stroke-width="2" rx="4" filter="url(#chalk)"/>
  <text x="160" y="334" text-anchor="middle" fill="#ddd" font-family="monospace" font-size="10" font-weight="bold">🛡 Trident Protect Application</text>
  <text x="160" y="350" text-anchor="middle" fill="#999" font-family="monospace" font-size="9">centos-vm-app</text>

  <!-- ArgoCD -> Trident App -->
  <line x1="270" y1="162" x2="160" y2="333" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrowWhite)"/>
  <text x="210" y="245" fill="#777" font-family="monospace" font-size="8">App Resource</text>

  <!-- Tekton -> Trident App -->
  <line x1="260" y1="222" x2="160" y2="335" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrowWhite)"/>
  <text x="200" y="275" fill="#777" font-family="monospace" font-size="8">Triggers Snapshots</text>

  <!-- === PATTERN A: SnapMirror === -->
  <rect x="460" y="70" width="250" height="200" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="8,4" rx="6"/>
  <text x="470" y="90" fill="#888" font-family="monospace" font-size="11" font-weight="bold" filter="url(#chalk)">Pattern A — SnapMirror</text>

  <!-- AMR -->
  <rect x="475" y="110" width="210" height="45" fill="none" stroke="#aaa" stroke-width="2" rx="4" filter="url(#chalk)"/>
  <text x="580" y="126" text-anchor="middle" fill="#ddd" font-family="monospace" font-size="10" font-weight="bold">⇄ AppMirrorRelationship</text>
  <text x="580" y="143" text-anchor="middle" fill="#999" font-family="monospace" font-size="9">vm-mirror-relationship</text>

  <!-- Standby VM -->
  <rect x="475" y="170" width="210" height="55" fill="none" stroke="#ddd" stroke-width="2" rx="5" filter="url(#chalk)"/>
  <rect x="475" y="170" width="210" height="20" fill="#334" rx="5"/>
  <text x="580" y="183" text-anchor="middle" fill="#8cf" font-family="monospace" font-size="9" font-weight="bold">🖥 Standby VM</text>
  <text x="580" y="200" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="10" font-weight="bold">Warm Standby → Live</text>
  <text x="580" y="217" text-anchor="middle" fill="#999" font-family="monospace" font-size="9">namespace: vm-dr-mirror</text>

  <!-- Arrow: Trident App -> AMR -->
  <line x1="250" y1="340" x2="580" y2="135" stroke="#aaa" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowWhite)"/>
  <text x="420" y="230" fill="#777" font-family="monospace" font-size="8">SnapMirror Replication (block-level)</text>

  <!-- AMR -> Standby VM -->
  <line x1="580" y1="155" x2="580" y2="175" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <!-- === PATTERN B: S3 Backup & Restore === -->
  <rect x="740" y="70" width="260" height="200" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="8,4" rx="6"/>
  <text x="750" y="90" fill="#888" font-family="monospace" font-size="11" font-weight="bold" filter="url(#chalk)">Pattern B — S3 Offsite</text>

  <!-- S3 -->
  <rect x="755" y="110" width="220" height="50" fill="none" stroke="#aaa" stroke-width="2" rx="4" filter="url(#chalk)"/>
  <text x="865" y="128" text-anchor="middle" fill="#ddd" font-family="monospace" font-size="10" font-weight="bold">☁ AWS S3 AppVault</text>
  <text x="865" y="145" text-anchor="middle" fill="#999" font-family="monospace" font-size="9">lab-vault</text>

  <!-- Restored VM -->
  <rect x="755" y="170" width="220" height="55" fill="none" stroke="#ddd" stroke-width="2" rx="5" filter="url(#chalk)"/>
  <rect x="755" y="170" width="220" height="20" fill="#334" rx="5"/>
  <text x="865" y="183" text-anchor="middle" fill="#8cf" font-family="monospace" font-size="9" font-weight="bold">🖥 Restored VM</text>
  <text x="865" y="200" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="10" font-weight="bold">Offsite Recovery</text>
  <text x="865" y="217" text-anchor="middle" fill="#999" font-family="monospace" font-size="9">namespace: vm-dr-backup</text>

  <!-- Arrow: Trident App -> S3 -->
  <line x1="250" y1="340" x2="865" y2="135" stroke="#aaa" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowWhite)"/>
  <text x="560" y="240" fill="#777" font-family="monospace" font-size="8">Kopia Data Mover → S3 Upload</text>

  <!-- S3 -> Restored VM -->
  <line x1="865" y1="155" x2="865" y2="175" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrowWhite)"/>
  <text x="880" y="163" fill="#777" font-family="monospace" font-size="7">BackupRestore CR</text>

  <!-- === LEGEND === -->
  <rect x="30" y="390" width="960" height="90" fill="none" stroke="#444" stroke-width="1" rx="4"/>
  <text x="45" y="408" fill="#999" font-family="monospace" font-size="10" font-weight="bold">LEGEND</text>
  <line x1="45" y1="425" x2="65" y2="425" stroke="#aaa" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="75" y="425" fill="#aaa" font-family="monospace" font-size="9">Storage block replication (SnapMirror / Kopia)</text>
  <line x1="45" y1="440" x2="65" y2="440" stroke="#aaa" stroke-width="2"/>
  <text x="75" y="440" fill="#aaa" font-family="monospace" font-size="9">Kubernetes manifest reconciliation (ArgoCD)</text>
  <line x1="350" y1="425" x2="370" y2="425" stroke="#555" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="380" y="425" fill="#aaa" font-family="monospace" font-size="9">Logical boundary (namespace/zone)</text>
  <rect x="550" y="420" width="80" height="12" fill="none" stroke="#aaa" stroke-width="1.5" rx="2"/>
  <text x="640" y="425" fill="#aaa" font-family="monospace" font-size="9">Kubernetes/ArgoCD resource</text>
  <rect x="710" y="420" width="80" height="12" fill="none" stroke="#ddd" stroke-width="2" rx="3"/>
  <text x="800" y="425" fill="#aaa" font-family="monospace" font-size="9">VM workload · Running</text>

  <!-- === KEY DATA FLOW LINES (re-emphasized) === -->
  <!-- Snapshot/Clone path -->
  <text x="50" y="500" fill="#ccc" font-family="monospace" font-size="11" font-weight="bold" filter="url(#chalk)">Key Data Flows:</text>

  <text x="50" y="522" fill="#6af" font-family="monospace" font-size="10">①</text>
  <text x="70" y="522" fill="#ccc" font-family="monospace" font-size="9">ArgoCD syncs Helm chart from Git → deploys VMs, Services, Trident Application CR</text>

  <text x="50" y="540" fill="#6af" font-family="monospace" font-size="10">②</text>
  <text x="70" y="540" fill="#ccc" font-family="monospace" font-size="9">Tekton triggers Trident Snapshot → Kopia streams encrypted blocks to S3 AppVault</text>

  <text x="50" y="558" fill="#6af" font-family="monospace" font-size="10">③</text>
  <text x="70" y="558" fill="#ccc" font-family="monospace" font-size="9">SnapMirror replicates PVC blocks at ONTAP layer → AMR maintains warm standby VM</text>

  <text x="50" y="576" fill="#6af" font-family="monospace" font-size="10">④</text>
  <text x="70" y="576" fill="#ccc" font-family="monospace" font-size="9">BackupRestore CR pulls from S3 → recreates PVCs and VM in vm-dr-backup</text>

  <!-- Footer -->
  <text x="512" y="660" text-anchor="middle" fill="#444" font-family="monospace" font-size="8" filter="url(#chalk)">AI Prompt: "hand-drawn technical illustration in chalk-on-blackboard style, pure black background, monochrome white and grey ink only, no color — architecture overview of GitOps-driven disaster recovery with ArgoCD, Tekton, OpenShift Virtualization, and NetApp Trident Protect showing three namespace zones (vm-prod, vm-dr-mirror, vm-dr-backup) with VM Blue/Green, S3 AppVault, and SnapMirror AMR"</text>
</svg>

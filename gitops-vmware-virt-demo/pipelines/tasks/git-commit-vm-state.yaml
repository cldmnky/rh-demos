apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-commit-vm-state
  namespace: vm-demo
spec:
  params:
    - name: vm-file
      description: "VM manifest filename (e.g. vm-blue.yaml or vm-green.yaml)"
    - name: run-strategy
      description: "Desired runStrategy: Always | Halted"
    - name: commit-message
      description: "Git commit message"
    - name: git-repo-url
      description: "SSH URL of the Git repository"
      default: "git@github.com:cldmnky/rh-demos.git"
    - name: repo-subdir
      description: "Path to this demo inside the Git repository"
      default: "gitops-vmware-virt-demo"
  workspaces:
    - name: ssh-key
      description: "SSH deploy key (key: id_rsa)"
  steps:
    - name: clone-modify-push
      image: alpine:3.20
      script: |
        #!/bin/sh
        set -eu
        apk add --no-cache git yq openssh-client

        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        cp /workspace/ssh-key/id_rsa ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no"

        git clone "$(params.git-repo-url)" /workspace/repo
        cd /workspace/repo

        BASE_DIR="$(params.repo-subdir)/base"

        yq e '.spec.runStrategy = "$(params.run-strategy)"' \
          -i "$BASE_DIR/$(params.vm-file)"

        git config user.email "tekton@openshift.local"
        git config user.name "Tekton Pipeline"
        git add "$BASE_DIR/$(params.vm-file)"
        git diff --cached --quiet && {
          echo "No Git changes needed — runStrategy already set to $(params.run-strategy)"
          exit 0
        }
        git commit -m "$(params.commit-message)"
        git push

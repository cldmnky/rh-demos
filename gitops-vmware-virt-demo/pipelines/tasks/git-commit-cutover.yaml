apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-commit-cutover
  namespace: vm-demo
spec:
  params:
    - name: active-slot
      description: "Slot to route traffic to: blue | green"
    - name: halted-vm-file
      description: "VM manifest to halt (e.g. vm-blue.yaml)"
    - name: commit-message
      description: "Git commit message"
    - name: git-repo-url
      description: "SSH URL of the Git repository"
      default: "git@github.com:cldmnky/rh-demos.git"
    - name: repo-subdir
      description: "Path to this demo inside the Git repository"
      default: "gitops-vmware-virt-demo"
  workspaces:
    - name: ssh-key
      description: "SSH deploy key (key: id_rsa)"
  steps:
    - name: clone-modify-push
      image: alpine:3.20
      script: |
        #!/bin/sh
        set -eu
        apk add --no-cache git yq openssh-client

        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        cp /workspace/ssh-key/id_rsa ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no"

        git clone "$(params.git-repo-url)" /workspace/repo
        cd /workspace/repo

        BASE_DIR="$(params.repo-subdir)/base"

        # Update service selector to active slot
        yq e '.spec.selector["kubevirt.io/domain"] = "demo-vm-$(params.active-slot)"' \
          -i "$BASE_DIR/service-lb.yaml"

        # Halt the outgoing VM
        yq e '.spec.runStrategy = "Halted"' \
          -i "$BASE_DIR/$(params.halted-vm-file)"

        git config user.email "tekton@openshift.local"
        git config user.name "Tekton Pipeline"
        git add "$BASE_DIR/service-lb.yaml" "$BASE_DIR/$(params.halted-vm-file)"
        git diff --cached --quiet && {
          echo "No Git changes needed"
          exit 0
        }
        git commit -m "$(params.commit-message)"
        git push

apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: install-app
  namespace: vm-demo
spec:
  params:
    - name: git-repo-url
      description: "HTTPS URL of the demo Git repository"
    - name: vm-name
      description: "Name of the VirtualMachine to install onto"
      default: demo-vm-blue
    - name: ssh-host
      description: "ClusterIP service FQDN for Ansible SSH access"
      default: demo-vm-blue-ssh.vm-demo.svc.cluster.local
    - name: lb-ip-url
      description: "URL of the MetalLB LoadBalancer (http://<LB_IP>)"
  workspaces:
    - name: ssh-key
      description: "SSH private key secret (key: id_rsa)"
  tasks:
    - name: wait-for-vmi-status
      taskRef:
        resolver: hub
        params:
          - name: catalog
            value: kubevirt-tekton-tasks
          - name: type
            value: artifact
          - name: kind
            value: task
          - name: name
            value: wait-for-vmi-status
          - name: version
            value: v0.25.0
      params:
        - name: vmiName
          value: $(params.vm-name)
        - name: vmiNamespace
          value: vm-demo
        - name: successCondition
          value: status.phase == Running
        - name: failureCondition
          value: status.phase in (Failed, Unknown)

    - name: ansible-install
      runAfter:
        - wait-for-vmi-status
      taskRef:
        kind: Task
        name: ansible-run-playbook
      params:
        - name: ssh-host
          value: $(params.ssh-host)
        - name: playbook-content
          value: |
            ---
            - hosts: demo_vm
              become: true
              tasks:
                - name: Install nginx
                  ansible.builtin.dnf:
                    name: nginx
                    state: present

                - name: Deploy application v1.0
                  ansible.builtin.copy:
                    dest: /usr/share/nginx/html/index.html
                    content: "<h1>Demo App v1.0 — served by {{ inventory_hostname }}</h1>"

                - name: Create health endpoint
                  ansible.builtin.copy:
                    dest: /usr/share/nginx/html/health
                    content: "ok"

                - name: Start and enable nginx
                  ansible.builtin.service:
                    name: nginx
                    state: started
                    enabled: true
      workspaces:
        - name: ssh-key
          workspace: ssh-key

    - name: smoke-test
      runAfter:
        - ansible-install
      taskRef:
        kind: Task
        name: smoke-test
      params:
        - name: url
          value: $(params.lb-ip-url)/health

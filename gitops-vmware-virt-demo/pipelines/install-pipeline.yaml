apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: install-app
  namespace: vm-demo
spec:
  params:
    - name: vm-name
      description: "Name of the VirtualMachine to install onto"
      default: demo-vm-blue
    - name: ssh-host
      description: "ClusterIP service FQDN for Ansible SSH access"
      default: demo-vm-blue-ssh.vm-demo.svc.cluster.local
    - name: lb-ip-url
      description: "URL of the MetalLB LoadBalancer (http://<LB_IP>)"
  workspaces:
    - name: ssh-key
      description: "SSH private key secret (key: id_rsa)"
  tasks:
    - name: wait-for-vmi-status
      taskRef:
        resolver: hub
        params:
          - name: catalog
            value: kubevirt-tekton-tasks
          - name: type
            value: artifact
          - name: kind
            value: task
          - name: name
            value: wait-for-vmi-status
          - name: version
            value: v0.25.0
      params:
        - name: vmiName
          value: $(params.vm-name)
        - name: vmiNamespace
          value: vm-demo
        - name: successCondition
          value: status.phase == Running
        - name: failureCondition
          value: status.phase in (Failed, Unknown)

    - name: ansible-install
      runAfter:
        - wait-for-vmi-status
      taskRef:
        kind: Task
        name: ansible-run-playbook
      params:
        - name: ssh-host
          value: $(params.ssh-host)
        - name: playbook-content
          value: |
            ---
            - hosts: demo_vm
              become: true
              tasks:
                - name: Create app directory
                  ansible.builtin.file:
                    path: /opt/demo-app
                    state: directory
                    mode: "0755"

                - name: Deploy application v1.0
                  ansible.builtin.copy:
                    dest: /opt/demo-app/index.html
                    content: "<h1>Demo App v1.0 — served by {{ inventory_hostname }}</h1>"

                - name: Create health endpoint
                  ansible.builtin.copy:
                    dest: /opt/demo-app/health
                    content: "ok"

                - name: Create systemd service
                  ansible.builtin.copy:
                    dest: /etc/systemd/system/demo-app.service
                    content: |
                      [Unit]
                      Description=Demo App HTTP Server
                      After=network.target

                      [Service]
                      Type=simple
                      WorkingDirectory=/opt/demo-app
                      ExecStart=/usr/bin/python3 -m http.server 80
                      Restart=on-failure

                      [Install]
                      WantedBy=multi-user.target

                - name: Start and enable demo-app
                  ansible.builtin.systemd:
                    name: demo-app
                    state: started
                    enabled: true
                    daemon_reload: true
      workspaces:
        - name: ssh-key
          workspace: ssh-key

    - name: smoke-test
      runAfter:
        - ansible-install
      taskRef:
        kind: Task
        name: smoke-test
      params:
        - name: url
          value: $(params.lb-ip-url)/health

apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: upgrade-app
  namespace: vm-demo
spec:
  params:
    - name: lb-ip-url
      description: "URL of the MetalLB LoadBalancer (http://<LB_IP>)"
    - name: run-id
      description: "Unique identifier for this upgrade run — defaults to PipelineRun name"
      default: "$(context.pipelineRun.name)"
  tasks:
    # [1] Safety net: snapshot blue before touching anything
    - name: snapshot-blue
      taskSpec:
        params:
          - name: run-id
            type: string
        results:
          - name: volume-snapshot-name
            description: CSI VolumeSnapshot name for blue VM rootdisk
        steps:
          - name: snapshot
            image: quay.io/openshift/origin-cli:latest
            script: |
              #!/bin/bash
              set -eu
              VM_SNAPSHOT="blue-pre-upgrade-$(params.run-id)"
              cat <<EOF | oc apply -f -
              apiVersion: snapshot.kubevirt.io/v1beta1
              kind: VirtualMachineSnapshot
              metadata:
                name: ${VM_SNAPSHOT}
                namespace: vm-demo
              spec:
                source:
                  apiGroup: kubevirt.io
                  kind: VirtualMachine
                  name: demo-vm-blue
              EOF
              oc wait --for=condition=Ready \
                virtualmachinesnapshot/${VM_SNAPSHOT} \
                -n vm-demo --timeout=300s

              CONTENT=$(oc get virtualmachinesnapshot "${VM_SNAPSHOT}" -n vm-demo \
                -o jsonpath='{.status.virtualMachineSnapshotContentName}')
              VOLUME_SNAPSHOT=$(oc get virtualmachinesnapshotcontent "${CONTENT}" -n vm-demo \
                -o jsonpath='{.status.volumeSnapshotStatus[0].volumeSnapshotName}')
              if [ -z "${VOLUME_SNAPSHOT}" ]; then
                echo "Could not resolve rootdisk VolumeSnapshot from ${CONTENT}" >&2
                exit 1
              fi

              printf '%s' "${VOLUME_SNAPSHOT}" > "$(results.volume-snapshot-name.path)"
              echo "Rootdisk VolumeSnapshot: ${VOLUME_SNAPSHOT}"
      params:
        - name: run-id
          value: $(params.run-id)

    # [2] Patch ArgoCD: start green from blue snapshot.
    # Deletes existing green VM/DataVolume first so the new disk source takes effect.
    # Sets ALL parameters for the start-green phase to avoid partial-list issues.
    - name: patch-start-green
      runAfter:
        - snapshot-blue
      taskSpec:
        params:
          - name: run-id
            type: string
          - name: volume-snapshot-name
            type: string
        steps:
          - name: patch-and-sync
            image: quay.io/openshift/origin-cli:latest
            script: |
              #!/bin/bash
              set -eu

              VM_SNAPSHOT="blue-pre-upgrade-$(params.run-id)"
              SNAPSHOT="$(params.volume-snapshot-name)"

              # Patch Application parameters FIRST (so any ArgoCD selfHeal uses the new values).
              # Full parameter set for start-green phase:
              #   blue  = Always (keep blue serving traffic while green prepares)
              #   green = Always (start green)
              #   green disk = blue rootdisk VolumeSnapshot from the VM snapshot
              #   traffic = blue (not cut over yet)
              oc patch application.argoproj.io vm-demo -n vm-demo --type=merge \
                --patch "{
                  \"spec\":{\"source\":{\"helm\":{\"parameters\":[
                    {\"name\":\"blue.runStrategy\",\"value\":\"Always\"},
                    {\"name\":\"green.runStrategy\",\"value\":\"Always\"},
                    {\"name\":\"green.diskSnapshot.name\",\"value\":\"${SNAPSHOT}\"},
                    {\"name\":\"green.diskSnapshot.namespace\",\"value\":\"vm-demo\"},
                    {\"name\":\"traffic.activeSlot\",\"value\":\"blue\"}
                  ]}}}}"

              # Delete green VM and DataVolume (cascades: VM owner-ref deletes DataVolume).
              # Parameters are already updated above, so any ArgoCD selfHeal that fires
              # during deletion will recreate green with the new snapshot.
              oc delete vm demo-vm-green -n vm-demo --ignore-not-found --wait=false
              oc delete datavolume centos10-green -n vm-demo --ignore-not-found --wait=false
              oc delete pvc centos10-green -n vm-demo --ignore-not-found --wait=false

              echo "Waiting for green VM and DataVolume to be fully deleted..."
              DEADLINE=$(( $(date +%s) + 120 ))
              until ! oc get vm demo-vm-green -n vm-demo >/dev/null 2>&1 && \
                    ! oc get datavolume centos10-green -n vm-demo >/dev/null 2>&1; do
                [ "$(date +%s)" -gt "${DEADLINE}" ] && { echo "Timeout waiting for green deletion"; exit 1; }
                sleep 3
              done
              echo "Green VM and DataVolume deleted."

              # Ask ArgoCD to refresh and wait for the concrete child resource.
              # Waiting on Application operationState is brittle when automated selfHeal is active.
              oc annotate application.argoproj.io vm-demo -n vm-demo \
                argocd.argoproj.io/refresh=hard --overwrite >/dev/null

              echo "Waiting for green VM to be rendered from ${VM_SNAPSHOT}/${SNAPSHOT}..."
              DEADLINE=$(( $(date +%s) + 600 ))
              until [[ "$(oc get vm demo-vm-green -n vm-demo \
                    -o jsonpath='{.spec.runStrategy}' 2>/dev/null)" == "Always" ]] && \
                    [[ "$(oc get vm demo-vm-green -n vm-demo \
                    -o jsonpath='{.spec.dataVolumeTemplates[0].spec.source.snapshot.name}' 2>/dev/null)" == "${SNAPSHOT}" ]]; do
                [ "$(date +%s)" -gt "${DEADLINE}" ] && { echo "Timeout waiting for green VM from snapshot"; exit 1; }
                echo -n '.'
                sleep 5
              done
              echo ""
              echo "Green VM rendered from rootdisk VolumeSnapshot ${SNAPSHOT}"
      params:
        - name: run-id
          value: $(params.run-id)
        - name: volume-snapshot-name
          value: $(tasks.snapshot-blue.results.volume-snapshot-name)

    # [3] Wait for green VMI to reach Running phase
    - name: wait-for-green
      runAfter:
        - patch-start-green
      taskRef:
        resolver: hub
        params:
          - name: catalog
            value: kubevirt-tekton-tasks
          - name: type
            value: artifact
          - name: kind
            value: task
          - name: name
            value: wait-for-vmi-status
          - name: version
            value: v0.25.0
      params:
        - name: vmiName
          value: demo-vm-green
        - name: vmiNamespace
          value: vm-demo
        - name: successCondition
          value: status.phase == Running
        - name: failureCondition
          value: status.phase in (Failed, Unknown)

    # [4] Ansible: deploy v2.0 onto green
    - name: ansible-upgrade
      runAfter:
        - wait-for-green
      taskRef:
        kind: Task
        name: ansible-run-playbook
      params:
        - name: ssh-host
          value: demo-vm-green-ssh.vm-demo.svc.cluster.local
        - name: playbook-content
          value: |
            ---
            - hosts: demo_vm
              become: true
              tasks:
                - name: Install httpd
                  ansible.builtin.dnf:
                    name: httpd
                    state: present

                - name: Deploy application v2.0
                  ansible.builtin.copy:
                    dest: /var/www/html/index.html
                    content: "<h1>Demo App v2.0 — served by {{ inventory_hostname }}</h1>"

                - name: Create health endpoint
                  ansible.builtin.copy:
                    dest: /var/www/html/health
                    content: "ok"

                - name: Start and enable httpd
                  ansible.builtin.service:
                    name: httpd
                    state: started
                    enabled: true
      workspaces:
        - name: ssh-key
          workspace: ssh-key

    # [5] Smoke test green directly before moving LoadBalancer traffic
    - name: smoke-test
      runAfter:
        - ansible-upgrade
      taskRef:
        kind: Task
        name: smoke-test
      params:
        - name: url
          value: http://demo-vm-green-http.vm-demo.svc.cluster.local/health

    # [6-PASS] Cutover: traffic → green, blue → Halted.
    # Full parameter set for cutover phase — must keep green=Always and disk snapshot.
    - name: patch-cutover
      runAfter:
        - smoke-test
      taskSpec:
        params:
          - name: run-id
            type: string
          - name: volume-snapshot-name
            type: string
        steps:
          - name: patch-and-sync
            image: quay.io/openshift/origin-cli:latest
            script: |
              #!/bin/bash
              set -eu

              SNAPSHOT="$(params.volume-snapshot-name)"

              # Full parameter set for cutover phase:
              #   blue  = Halted (powered off — no longer serving traffic)
              #   green = Always (serving traffic)
              #   green disk = blue rootdisk VolumeSnapshot (unchanged from start-green)
              #   traffic = green (LoadBalancer routes to green)
              oc patch application.argoproj.io vm-demo -n vm-demo --type=merge \
                --patch "{
                  \"spec\":{\"source\":{\"helm\":{\"parameters\":[
                    {\"name\":\"blue.runStrategy\",\"value\":\"Halted\"},
                    {\"name\":\"green.runStrategy\",\"value\":\"Always\"},
                    {\"name\":\"green.diskSnapshot.name\",\"value\":\"${SNAPSHOT}\"},
                    {\"name\":\"green.diskSnapshot.namespace\",\"value\":\"vm-demo\"},
                    {\"name\":\"traffic.activeSlot\",\"value\":\"green\"}
                  ]}}}}"

              oc annotate application.argoproj.io vm-demo -n vm-demo \
                argocd.argoproj.io/refresh=hard --overwrite >/dev/null

              echo "Waiting for cutover (traffic → green, blue → Halted)..."
              DEADLINE=$(( $(date +%s) + 600 ))
              until [[ "$(oc get svc demo-app-lb -n vm-demo \
                    -o jsonpath='{.spec.selector}' 2>/dev/null)" == *"demo-vm-green"* ]] && \
                    [[ "$(oc get vm demo-vm-blue -n vm-demo \
                    -o jsonpath='{.spec.runStrategy}' 2>/dev/null)" == "Halted" ]]; do
                [ "$(date +%s)" -gt "${DEADLINE}" ] && { echo "Timeout waiting for cutover"; exit 1; }
                echo -n '.'
                sleep 5
              done
              echo ""
              echo "Cutover complete — traffic on green, blue halted"
      params:
        - name: run-id
          value: $(params.run-id)
        - name: volume-snapshot-name
          value: $(tasks.snapshot-blue.results.volume-snapshot-name)

  workspaces:
    - name: ssh-key
      description: "SSH private key secret (key: id_rsa)"

  # [6-FAIL] If smoke-test fails, halt green and leave blue untouched.
  finally:
    - name: patch-stop-green-on-failure
      taskSpec:
        params:
          - name: run-id
            type: string
          - name: volume-snapshot-name
            type: string
        steps:
          - name: patch-and-sync
            image: quay.io/openshift/origin-cli:latest
            script: |
              #!/bin/bash
              set -eu

              SNAPSHOT="$(params.volume-snapshot-name)"

              # Full parameter set for failure rollback:
              #   blue  = Always (keep blue serving traffic — it was never touched)
              #   green = Halted (abort — smoke test failed)
              #   green disk = blue rootdisk VolumeSnapshot (avoid changing DataVolume source while VM exists)
              #   traffic = blue (ensure LB stays on blue)
              oc patch application.argoproj.io vm-demo -n vm-demo --type=merge \
                --patch '{
                  "spec":{"source":{"helm":{"parameters":[
                    {"name":"blue.runStrategy","value":"Always"},
                    {"name":"green.runStrategy","value":"Halted"},
                    {"name":"green.diskSnapshot.name","value":"'"${SNAPSHOT}"'"},
                    {"name":"green.diskSnapshot.namespace","value":"vm-demo"},
                    {"name":"traffic.activeSlot","value":"blue"}
                  ]}}}}'

              oc annotate application.argoproj.io vm-demo -n vm-demo \
                argocd.argoproj.io/refresh=hard --overwrite >/dev/null

              DEADLINE=$(( $(date +%s) + 600 ))
              until [[ "$(oc get svc demo-app-lb -n vm-demo \
                    -o jsonpath='{.spec.selector}' 2>/dev/null)" == *"demo-vm-blue"* ]] && \
                    [[ "$(oc get vm demo-vm-green -n vm-demo \
                    -o jsonpath='{.spec.runStrategy}' 2>/dev/null)" == "Halted" ]]; do
                [ "$(date +%s)" -gt "${DEADLINE}" ] && { echo "Timeout waiting for green halt"; exit 1; }
                sleep 5
              done
              echo "Green halted, blue still running, users unaffected"
      params:
        - name: run-id
          value: $(params.run-id)
        - name: volume-snapshot-name
          value: $(tasks.snapshot-blue.results.volume-snapshot-name)
      when:
        - input: "$(tasks.smoke-test.status)"
          operator: in
          values: ["Failed"]

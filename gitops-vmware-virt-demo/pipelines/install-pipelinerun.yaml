apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: install-app-
  namespace: vm-demo
spec:
  pipelineRef:
    name: install-app
  params:
    - name: lb-ip-url
      value: http://demo-app-lb.vm-demo.svc.cluster.local
  workspaces:
    - name: ssh-key
      secret:
        secretName: vm-ssh-key

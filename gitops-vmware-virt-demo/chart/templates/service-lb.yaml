apiVersion: v1
kind: Service
metadata:
  name: demo-app-lb
  namespace: vm-demo
{{- if eq .Values.loadBalancer.provider "metallb" }}
  annotations:
    metallb.universe.tf/address-pool: {{ .Values.loadBalancer.metallb.addressPool }}
{{- end }}
spec:
  type: LoadBalancer
  selector:
    # Pipeline overrides traffic.activeSlot to switch between blue and green.
    kubevirt.io/domain: demo-vm-{{ .Values.traffic.activeSlot }}
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP

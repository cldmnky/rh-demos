apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: demo-vm-green
  namespace: vm-demo
  labels:
    app: demo-app
    slot: green
spec:
  # Halted at rest — zero compute cost. Pipeline overrides to Always during upgrade.
  runStrategy: {{ .Values.green.runStrategy }}
  dataVolumeTemplates:
    - metadata:
        name: centos10-green
      spec:
        storage:
          accessModes:
            - ReadWriteMany
          resources:
            requests:
              storage: {{ .Values.storage.size }}
          storageClassName: {{ .Values.storage.storageClass }}
        source:
          snapshot:
            # Pipeline overrides this to the blue pre-upgrade snapshot for each run.
            name: {{ .Values.green.diskSnapshot.name }}
            namespace: {{ .Values.green.diskSnapshot.namespace }}
  template:
    metadata:
      labels:
        app: demo-app
        kubevirt.io/domain: demo-vm-green
    spec:
      domain:
        resources:
          requests:
            memory: 2Gi
        cpu:
          cores: 2
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: centos10-green
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: vm-cloud-init

# ROSA/OpenShift 4.18 profile.
# The snapshot name is generated by the cluster boot source importer; verify it
# against the centos-stream10 DataSource before running the ROSA demo scripts.

blue:
  diskSnapshot:
    name: centos-stream10-bc3fd60ed98e
    namespace: openshift-virtualization-os-images

green:
  diskSnapshot:
    name: centos-stream10-bc3fd60ed98e
    namespace: openshift-virtualization-os-images

storage:
  storageClass: storage-class-iscsi
  accessMode: ReadWriteMany
  volumeMode: Block

loadBalancer:
  provider: aws

---
# install-app.yaml — installs httpd and serves v1.0 on the target VM
- hosts: demo_vm
  become: true
  tasks:
    - name: Install httpd
      ansible.builtin.dnf:
        name: httpd
        state: present

    - name: Deploy application v1.0
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: "<h1>Demo App v1.0 — served by {{ inventory_hostname }}</h1>"

    - name: Create health endpoint
      ansible.builtin.copy:
        dest: /var/www/html/health
        content: "ok"

    - name: Start and enable httpd
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true

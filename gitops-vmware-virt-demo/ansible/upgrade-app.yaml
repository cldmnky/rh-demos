---
# upgrade-app.yaml — upgrades the demo app to v2.0 on the target VM
- hosts: demo_vm
  become: true
  tasks:
    - name: Deploy application v2.0
      ansible.builtin.copy:
        dest: /opt/demo-app/index.html
        content: "<h1>Demo App v2.0 — served by {{ inventory_hostname }}</h1>"

    - name: Restart demo-app
      ansible.builtin.systemd:
        name: demo-app
        state: restarted

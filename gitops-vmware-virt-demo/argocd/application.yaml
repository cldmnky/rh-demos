apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vm-demo
  namespace: vm-demo
spec:
  project: vm-demo
  source:
    repoURL: https://github.com/cldmnky/rh-demos
    targetRevision: main
    path: gitops-vmware-virt-demo/base
  destination:
    server: https://kubernetes.default.svc
    namespace: vm-demo
  syncPolicy:
    automated:
      prune: true      # removes resources deleted from Git
      selfHeal: true   # reverts out-of-band cluster changes
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: kubevirt.io
      kind: VirtualMachine
      jsonPointers:
        - /spec/template/spec/architecture

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vm-demo-infra
  namespace: vm-demo
spec:
  project: vm-demo
  source:
    repoURL: https://github.com/cldmnky/rh-demos
    targetRevision: main
    path: gitops-vmware-virt-demo/pipelines
    directory:
      exclude: '{install-pipelinerun.yaml,upgrade-pipelinerun.yaml,ansible-configmaps.yaml}'
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: vm-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

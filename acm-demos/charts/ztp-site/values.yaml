# true still allows discovery/boot; it holds the destructive OS installation.
holdInstallation: true
templatesNamespace: siteconfig-operator
clusterTemplate: ai-cluster-templates-v1
nodeTemplate: ai-node-templates-v1
bmcAddress: ""
bmcSecret: ztp-sno-bmc

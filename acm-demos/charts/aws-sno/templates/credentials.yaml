{{- if .Values.credentials.copyFromHub -}}
{{- if not .Values.credentials.acceptReleaseSecretStorage }}{{ fail "Credential copying requires credentials.acceptReleaseSecretStorage=true; credentials will persist in Helm release history" }}{{ end -}}
{{- $secret := lookup "v1" "Secret" .Values.credentials.sourceNamespace .Values.credentials.sourceName -}}
{{- if not $secret }}{{ fail "Source credential not accessible; lookup needs an approved live Helm operation. Offline rendering must use references only" }}{{ end -}}
{{- $data := $secret.data -}}
{{- range $key := list "aws_access_key_id" "aws_secret_access_key" "pullSecret" "ssh-privatekey" "ssh-publickey" "baseDomain" -}}
{{- if not (index $data $key) }}{{ fail (printf "Source credential missing field %s" $key) }}{{ end -}}
{{- end -}}
{{- if ne (trim (index $data "baseDomain" | b64dec)) .Values.baseDomain }}{{ fail "baseDomain differs from source credential" }}{{ end -}}
{{- $pull := index $data "pullSecret" | b64dec -}}
{{- $install := dict "apiVersion" "v1" "baseDomain" .Values.baseDomain "metadata" (dict "name" .Values.clusterName) "publish" "External" "pullSecret" $pull "sshKey" (index $data "ssh-publickey" | b64dec | trim) -}}
{{- $_ := set $install "compute" (list (dict "name" "worker" "replicas" 0 "architecture" "amd64")) -}}
{{- $_ := set $install "controlPlane" (dict "name" "master" "replicas" 1 "architecture" "amd64" "platform" (dict "aws" (dict "type" .Values.instanceType "rootVolume" (dict "size" .Values.rootVolumeGiB "type" "gp3")))) -}}
{{- $_ := set $install "platform" (dict "aws" (dict "region" .Values.region)) -}}
{{- $_ := set $install "networking" (dict "networkType" "OVNKubernetes" "clusterNetwork" (list (dict "cidr" "10.128.0.0/14" "hostPrefix" 23)) "machineNetwork" (list (dict "cidr" "10.0.0.0/16")) "serviceNetwork" (list "172.30.0.0/16")) -}}
{{- $proxy := dict -}}
{{- range $key := list "httpProxy" "httpsProxy" "noProxy" -}}
{{- $value := index $data $key | default "" | b64dec | trim -}}
{{- if $value }}{{ $_ := set $proxy $key $value }}{{ end -}}
{{- end -}}
{{- if $proxy }}{{ $_ := set $install "proxy" $proxy }}{{ end -}}
{{- $trust := index $data "additionalTrustBundle" | default "" | b64dec -}}
{{- if $trust }}{{ $_ := set $install "additionalTrustBundle" $trust }}{{ end -}}
{{- $secrets := list
  (dict "name" .Values.credentials.awsSecret "type" "Opaque" "data" (dict "aws_access_key_id" (index $data "aws_access_key_id") "aws_secret_access_key" (index $data "aws_secret_access_key")))
  (dict "name" .Values.credentials.pullSecret "type" "kubernetes.io/dockerconfigjson" "data" (dict ".dockerconfigjson" (index $data "pullSecret")))
  (dict "name" .Values.credentials.sshSecret "type" "Opaque" "data" (dict "ssh-privatekey" (index $data "ssh-privatekey")))
  (dict "name" .Values.credentials.installConfigSecret "type" "Opaque" "data" (dict "install-config.yaml" ($install | toYaml | b64enc))) -}}
{{- range $item := $secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $item.name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: {{ $item.type }}
data:
{{ $item.data | toYaml | indent 2 }}
{{- end }}
{{- end }}

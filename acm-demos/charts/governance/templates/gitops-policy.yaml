{{- if .Values.gitops.enabled }}
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: {{ .Release.Name }}-gitops
  namespace: {{ .Release.Namespace }}
spec:
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: {{ .Release.Name }}-gitops-operator
        spec:
          remediationAction: enforce
          severity: medium
          pruneObjectBehavior: None
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: openshift-gitops-operator
                  namespace: openshift-operators
                spec:
                  channel: {{ .Values.gitops.channel | quote }}
                  installPlanApproval: Automatic
                  name: openshift-gitops-operator
                  source: redhat-operators
                  sourceNamespace: openshift-marketplace
{{- if .Values.gitops.agentNamespace }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: {{ .Values.gitops.agentNamespace }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: RoleBinding
                metadata:
                  name: demo-gitops-agent-edit
                  namespace: {{ .Values.gitops.agentNamespace }}
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: edit
                subjects:
                  - kind: ServiceAccount
                    name: acm-openshift-gitops-argocd-application-controller
                    namespace: openshift-gitops
{{- end }}
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: {{ .Release.Name }}-gitops
  namespace: {{ .Release.Namespace }}
placementRef:
  name: {{ .Release.Name }}
  kind: Placement
  apiGroup: cluster.open-cluster-management.io
subjects:
  - name: {{ .Release.Name }}-gitops
    kind: Policy
    apiGroup: policy.open-cluster-management.io
{{- end }}

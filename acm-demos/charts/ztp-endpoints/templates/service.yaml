apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    demo.redhat.com/site: {{ .Values.site | quote }}
  ports:
    - name: api
      port: 6443
      targetPort: 6443
    - name: machine-config
      port: 22623
      targetPort: 22623
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443

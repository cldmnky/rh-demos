# Upstream kubevirtbmc chart 0.8.0 / controller v0.11.0, not our charts/bootstrap.
# helm template kubevirtbmc kubevirtbmc --repo https://charts.kubevirtbmc.io \
#   --version 0.8.0 -n kubevirtbmc-system -f values/kubevirtbmc.yaml --include-crds
image:
  tag: v0.11.0
replicaCount: 1
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
# Review generated cluster RBAC/webhooks/CRDs and per-VM agent image defaults
# before approval. No broad SCC grant or host libvirt socket mount is provided.

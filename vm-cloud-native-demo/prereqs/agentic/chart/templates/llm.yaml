apiVersion: v1
kind: ConfigMap
metadata:
  name: rocket-ramen-agent-llm
data:
  config.yaml: |
    model_list:
      - model_name: demo-model
        litellm_params:
          model: {{ printf "azure/%s" (required "provider.deployment required" .Values.provider.deployment) | quote }}
          api_base: {{ required "provider.url required" .Values.provider.url | quote }}
          api_version: {{ .Values.provider.apiVersion | quote }}
    litellm_settings:
      enable_azure_ad_token_refresh: true
      drop_params: true
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      disable_admin_ui: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rocket-ramen-agent-llm
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: rocket-ramen-agent-llm
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: rocket-ramen-agent-llm-tls
spec:
  selector: {app: rocket-ramen-agent-llm}
  ports:
    - {name: https, port: 8443, targetPort: https}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocket-ramen-agent-llm
spec:
  replicas: 1
  selector:
    matchLabels: {app: rocket-ramen-agent-llm}
  template:
    metadata:
      labels: {app: rocket-ramen-agent-llm}
      annotations:
        checksum/config: {{ printf "%s/%s/%s" .Values.provider.url .Values.provider.deployment .Values.provider.apiVersion | sha256sum }}
    spec:
      serviceAccountName: rocket-ramen-agent-llm
      automountServiceAccountToken: false
      containers:
        - name: proxy
          image: {{ .Values.proxyImage | quote }}
          command: [litellm]
          args: ["--config", /etc/llm/config.yaml, "--host", "0.0.0.0", "--port", "8443", "--ssl_certfile_path", /etc/tls/tls.crt, "--ssl_keyfile_path", /etc/tls/tls.key]
          env:
            - {name: HOME, value: /tmp}
            - {name: XDG_CACHE_HOME, value: /tmp/.cache}
            - {name: LITELLM_MODE, value: PRODUCTION}
            - {name: LITELLM_LOCAL_MODEL_COST_MAP, value: "true"}
            - {name: DISABLE_ADMIN_UI, value: "true"}
            - name: AZURE_CLIENT_ID
              valueFrom: {secretKeyRef: {name: {{ .Values.provider.credentialsSecret | quote }}, key: client_id}}
            - name: AZURE_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.provider.credentialsSecret | quote }}, key: client_secret}}
            - name: AZURE_TENANT_ID
              valueFrom: {secretKeyRef: {name: {{ .Values.provider.credentialsSecret | quote }}, key: tenant_id}}
            - name: LITELLM_MASTER_KEY
              valueFrom: {secretKeyRef: {name: rocket-ramen-agent-llm-key, key: apikey}}
          ports: [{name: https, containerPort: 8443}]
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          readinessProbe:
            httpGet: {path: /health/liveliness, port: https, scheme: HTTPS}
            initialDelaySeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health/liveliness, port: https, scheme: HTTPS}
            initialDelaySeconds: 60
            timeoutSeconds: 5
          volumeMounts:
            - {name: config, mountPath: /etc/llm, readOnly: true}
            - {name: tls, mountPath: /etc/tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: rocket-ramen-agent-llm}}
        - {name: tls, secret: {secretName: rocket-ramen-agent-llm-tls}}
        - {name: tmp, emptyDir: {}}

# Generated by ./prereqs/scripts/render-devworkspace.sh. Edit devfile.yaml or editor-che-code.yaml.
---
apiVersion: workspace.devfile.io/v1alpha2
kind: DevWorkspace
metadata:
  name: rocket-ramen
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    demo.redhat.com/purpose: Prerequisite Dev Spaces workspace for the Rocket Ramen
      presentation
spec:
  started: true
  template:
    projects:
    - name: rh-demos
      git:
        remotes:
          origin: https://github.com/cldmnky/rh-demos.git
        checkoutFrom:
          revision: main
    components:
    - name: go
      container:
        image: registry.access.redhat.com/ubi9/go-toolset:latest
        env:
        - name: GOPATH
          value: "/tmp/go"
        - name: GOCACHE
          value: "/tmp/go-build"
        - name: CODE_HOST
          value: 0.0.0.0
        command:
        - tail
        - "-f"
        - "/dev/null"
        memoryLimit: 2Gi
        mountSources: true
    - name: node
      container:
        image: registry.access.redhat.com/ubi9/nodejs-20:latest
        command:
        - tail
        - "-f"
        - "/dev/null"
        memoryLimit: 2Gi
        mountSources: true
        endpoints:
        - name: vite
          targetPort: 5173
          exposure: public
          protocol: http
        env:
        - name: API_URL
          value: http://orders-api.rocket-ramen.svc.cluster.local:8080
    - name: openshift-cli
      container:
        image: quay.io/openshift/origin-cli:4.22
        memoryLimit: 1Gi
        mountSources: true
        command:
        - tail
        - "-f"
        - "/dev/null"
    - container:
        command:
        - "/entrypoint-init-container.sh"
        cpuLimit: 500m
        cpuRequest: 30m
        image: registry.redhat.io/devspaces/code-rhel9@sha256:850f06cbea36aa63af1e1ecfb7210f524a15e4f3a3d770143fba92ad49533f0c
        memoryLimit: 256Mi
        memoryRequest: 32Mi
        volumeMounts:
        - name: checode
          path: "/checode"
      name: che-code-injector
    - attributes:
        app.kubernetes.io/component: che-code-runtime
        app.kubernetes.io/part-of: che-code.eclipse.org
        controller.devfile.io/container-contribution: true
      container:
        cpuLimit: 500m
        cpuRequest: 30m
        endpoints:
        - attributes:
            cookiesAuthEnabled: true
            discoverable: false
            type: main
            urlRewriteSupported: true
          exposure: public
          name: che-code
          protocol: https
          secure: true
          targetPort: 3100
        - attributes:
            discoverable: false
            urlRewriteSupported: false
          exposure: public
          name: code-redirect-1
          protocol: https
          targetPort: 13131
        - attributes:
            discoverable: false
            urlRewriteSupported: false
          exposure: public
          name: code-redirect-2
          protocol: https
          targetPort: 13132
        - attributes:
            discoverable: false
            urlRewriteSupported: false
          exposure: public
          name: code-redirect-3
          protocol: https
          targetPort: 13133
        image: registry.redhat.io/devspaces/udi-rhel9@sha256:0a8e5ba10a63597e50dbdcb7b131f899cc47f4590226decbaea0e8af7b0a3370
        memoryLimit: 1024Mi
        memoryRequest: 256Mi
        volumeMounts:
        - name: checode
          path: "/checode"
      name: che-code-runtime-description
    - name: checode
      volume: {}
    commands:
    - id: test-api
      exec:
        component: go
        workingDir: "${PROJECTS_ROOT}/rh-demos/vm-cloud-native-demo/backend"
        commandLine: go test ./...
        group:
          kind: test
          isDefault: true
    - id: check-frontend
      exec:
        component: node
        workingDir: "${PROJECTS_ROOT}/rh-demos/vm-cloud-native-demo/frontend"
        commandLine: npm ci && npm run typecheck
        group:
          kind: test
    - id: build-frontend
      exec:
        component: node
        workingDir: "${PROJECTS_ROOT}/rh-demos/vm-cloud-native-demo"
        commandLine: "./scripts/build-frontend.sh"
        group:
          kind: build
          isDefault: true
    - id: dev-frontend
      exec:
        component: node
        workingDir: "${PROJECTS_ROOT}/rh-demos/vm-cloud-native-demo/frontend"
        commandLine: npm run dev -- --host 0.0.0.0
        group:
          kind: run
          isDefault: true
    - id: test-ui
      exec:
        component: node
        workingDir: "${PROJECTS_ROOT}/rh-demos/vm-cloud-native-demo/frontend"
        commandLine: npx playwright test
        group:
          kind: test
    - apply:
        component: che-code-injector
      id: init-container-command
    - exec:
        commandLine: nohup /checode/entrypoint-volume.sh > /checode/entrypoint-logs.txt
          2>&1 &
        component: che-code-runtime-description
      id: init-che-code-command
    events:
      postStart:
      - init-che-code-command
      preStart:
      - init-container-command

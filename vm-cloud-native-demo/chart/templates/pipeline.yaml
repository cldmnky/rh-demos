apiVersion: v1
kind: ServiceAccount
metadata:
  name: vm-provisioner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vm-provisioner
rules:
  - apiGroups: [kubevirt.io]
    resources: [virtualmachines]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [kubevirt.io]
    resources: [virtualmachineinstances]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vm-provisioner
subjects:
  - kind: ServiceAccount
    name: vm-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vm-provisioner
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vm-definitions
data:
{{- range $tier := list "web" "app" "db" }}
  {{ $tier }}.yaml: |
    apiVersion: kubevirt.io/v1
    kind: VirtualMachine
    metadata:
      name: orders-{{ $tier }}
    spec:
      runStrategy: Always
      dataVolumeTemplates:
        - metadata:
            name: orders-{{ $tier }}-root
          spec:
            sourceRef:
              kind: DataSource
              name: {{ $.Values.vm.sourceName }}
              namespace: {{ $.Values.vm.sourceNamespace }}
            storage:
              resources:
                requests:
                  storage: {{ $.Values.vm.diskSize }}
              {{- with $.Values.vm.storageClass }}
              storageClassName: {{ . | quote }}
              {{- end }}
      template:
        metadata:
          labels:
            app: orders-{{ $tier }}
        spec:
          domain:
            cpu:
              cores: {{ $.Values.vm.cpu }}
            memory:
              guest: {{ $.Values.vm.memory }}
            devices:
              disks:
                - name: rootdisk
                  disk: {bus: virtio}
                - name: cloudinit
                  disk: {bus: virtio}
              interfaces:
                - name: default
                  masquerade: {}
          networks:
            - name: default
              pod: {}
          volumes:
            - name: rootdisk
              dataVolume:
                name: orders-{{ $tier }}-root
            - name: cloudinit
              cloudInitNoCloud:
                secretRef:
                  name: orders-{{ $tier }}-cloudinit
{{- end }}
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: provision-orders-vms
spec:
  steps:
    - name: create-and-wait
      image: {{ .Values.pipeline.cliImage | quote }}
      timeout: 20m
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        for tier in db app web; do
          oc apply -f "/definitions/${tier}.yaml"
        done
        for tier in db app web; do
          echo "Waiting for orders-${tier} VM to be ready"
          oc wait --for=condition=Ready "vm/orders-${tier}" --timeout=15m
        done
      volumeMounts:
        - name: definitions
          mountPath: /definitions
          readOnly: true
  volumes:
    - name: definitions
      configMap:
        name: vm-definitions
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: provision-orders
spec:
  tasks:
    - name: provision
      taskRef:
        name: provision-orders-vms

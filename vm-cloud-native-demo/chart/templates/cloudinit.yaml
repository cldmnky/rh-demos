{{- /*
  Guest bootstrap for the three VM tiers. Everything here runs on first boot:
  the web VM only unpacks a prebuilt bundle (it never runs npm), the app VM
  compiles the same Go sources the container image uses, and the db VM seeds
  MariaDB from the same schema file the containers would use.
*/ -}}
{{- range $tier := list "web" "app" "db" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: orders-{{ $tier }}-cloudinit
type: Opaque
stringData:
  userdata: |
    #cloud-config
    package_update: false
    {{- if eq $tier "web" }}
    packages: [nodejs]
    write_files:
      # The PatternFly bundle is built on a workstation or in Dev Spaces, then
      # packed here. `scripts/build-frontend.sh` refuses to exceed 900 KB of
      # base64, because userdata becomes a Secret and Secrets are capped at 1 MiB.
      - path: /opt/orders/web.tar.gz
        encoding: b64
        permissions: '0644'
        content: |
{{ required "chart/files/web.tar.gz is missing: run scripts/build-frontend.sh" ($.Files.Get "files/web.tar.gz") | b64enc | indent 10 }}
      - path: /opt/orders/server.js
        content: |
{{ $.Files.Get "files/server.js" | indent 10 }}
      - path: /etc/systemd/system/orders-web.service
        content: |
          [Unit]
          Description=Rocket Ramen web tier (Node + PatternFly)
          After=network-online.target
          [Service]
          Environment=WEB_ROOT=/opt/orders/web
          Environment=API_URL=http://orders-app:8080
          Environment=WEB_RUNTIME=VM
          ExecStart=/usr/bin/node /opt/orders/server.js
          Restart=always
          [Install]
          WantedBy=multi-user.target
    runcmd:
      - [sh, -c, 'systemctl disable --now firewalld || true']
      - [sh, -c, 'mkdir -p /opt/orders/web && tar -xzf /opt/orders/web.tar.gz -C /opt/orders/web && rm -f /opt/orders/web.tar.gz']
      - [systemctl, daemon-reload]
      - [systemctl, enable, --now, orders-web]
    {{- else if eq $tier "app" }}
    packages: [golang]
    write_files:
      - path: /opt/orders/main.go
        content: |
{{ $.Files.Get "files/main.go" | indent 10 }}
      - path: /opt/orders/store.go
        content: |
{{ $.Files.Get "files/store.go" | indent 10 }}
      - path: /opt/orders/hub.go
        content: |
{{ $.Files.Get "files/hub.go" | indent 10 }}
      - path: /opt/orders/go.mod
        content: |
{{ $.Files.Get "files/go.mod" | indent 10 }}
      - path: /opt/orders/go.sum
        content: |
{{ $.Files.Get "files/go.sum" | indent 10 }}
      - path: /etc/systemd/system/orders-api.service
        content: |
          [Unit]
          Description=Rocket Ramen API (Go)
          After=network-online.target
          [Service]
          Environment=APP_RUNTIME=VM
          Environment=DB_DSN=orders:demo-only-password@tcp(orders-db:3306)/orders?parseTime=true&charset=utf8mb4&timeout=3s
          ExecStart=/opt/orders/orders
          Restart=always
          [Install]
          WantedBy=multi-user.target
    runcmd:
      - [sh, -c, 'systemctl disable --now firewalld || true']
      - [sh, -c, 'cd /opt/orders && go build -o orders .']
      - [systemctl, daemon-reload]
      - [systemctl, enable, --now, orders-api]
    {{- else }}
    packages: [mariadb-server]
    write_files:
      - path: /opt/orders/schema.sql
        content: |
{{ $.Files.Get "files/schema.sql" | indent 10 }}
      # Idempotent: safe to re-run inside the guest after a schema change.
      - path: /usr/local/sbin/init-orders-db
        permissions: '0755'
        content: |
          #!/bin/bash
          set -euo pipefail
          systemctl enable --now mariadb
          mariadb <<'SQL'
          CREATE DATABASE IF NOT EXISTS orders CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE USER IF NOT EXISTS 'orders'@'%' IDENTIFIED BY 'demo-only-password';
          GRANT ALL ON orders.* TO 'orders'@'%';
          SQL
          # --default-character-set matters: the menu is seeded with emoji.
          mariadb --default-character-set=utf8mb4 orders < /opt/orders/schema.sql
    runcmd:
      - [sh, -c, 'systemctl disable --now firewalld || true']
      - [/usr/local/sbin/init-orders-db]
    {{- end }}
{{- end }}

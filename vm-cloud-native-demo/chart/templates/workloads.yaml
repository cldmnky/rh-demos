{{- range $tier := list "web" "app" "db" }}
---
apiVersion: v1
kind: Service
metadata:
  name: orders-{{ $tier }}
spec:
  selector:
    {{- if and (ne $tier "db") (index $.Values $tier "active") }}
    app: orders-{{ $tier }}-container
    {{- else }}
    kubevirt.io/domain: orders-{{ $tier }}
    {{- end }}
  ports:
    - name: {{ if eq $tier "db" }}mysql{{ else }}http{{ end }}
      port: {{ if eq $tier "db" }}3306{{ else }}8080{{ end }}
      targetPort: {{ if eq $tier "db" }}3306{{ else }}8080{{ end }}
{{- end }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: orders
  annotations:
    # The board holds an SSE connection open. Keep the router's idle timeout
    # above the API's 10s heartbeat so /api/stream is not cut mid-demo.
    haproxy.router.openshift.io/timeout: 5m
spec:
  to:
    kind: Service
    name: orders-web
  port:
    targetPort: http

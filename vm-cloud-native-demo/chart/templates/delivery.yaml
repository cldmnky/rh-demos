{{- range $tier := list "web" "app" }}
{{- $settings := index $.Values $tier }}
{{- if $settings.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-{{ $tier }}-container
spec:
  replicas: 1
  selector:
    matchLabels: {app: orders-{{ $tier }}-container}
  template:
    metadata:
      labels: {app: orders-{{ $tier }}-container}
    spec:
      containers:
        - name: {{ $tier }}
          image: {{ required (printf "%s.image is required" $tier) $settings.image | quote }}
          ports:
            - containerPort: 8080
          env:
            {{- if eq $tier "app" }}
            - name: APP_RUNTIME
              value: container
            {{- else }}
            - name: WEB_RUNTIME
              value: container
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ if eq $tier "app" }}/health{{ else }}/{{ end }}
              port: 8080
{{- end }}
{{- end }}

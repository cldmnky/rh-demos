schemaVersion: 2.2.0
metadata:
  name: vm-cloud-native-demo
components:
  - name: go
    container:
      image: registry.access.redhat.com/ubi9/go-toolset:latest
      memoryLimit: 2Gi
      mountSources: true
  - name: node
    container:
      image: registry.access.redhat.com/ubi9/nodejs-20:latest
      memoryLimit: 2Gi
      mountSources: true
commands:
  - id: test-api
    exec:
      component: go
      workingDir: ${PROJECT_SOURCE}/vm-cloud-native-demo/backend
      commandLine: go test ./...
      group:
        kind: test
        isDefault: true
  - id: check-frontend
    exec:
      component: node
      workingDir: ${PROJECT_SOURCE}/vm-cloud-native-demo/frontend
      commandLine: npm ci && npm run typecheck
      group:
        kind: test
  - id: build-frontend
    exec:
      component: node
      workingDir: ${PROJECT_SOURCE}/vm-cloud-native-demo
      commandLine: ./scripts/build-frontend.sh
      group:
        kind: build
        isDefault: true
  # In Dev Spaces the node and go components are separate pods: export
  # API_URL=<the orders-api Service or Route> before starting this command.
  - id: dev-frontend
    exec:
      component: node
      workingDir: ${PROJECT_SOURCE}/vm-cloud-native-demo/frontend
      commandLine: npm run dev -- --host 0.0.0.0
      group:
        kind: run
        isDefault: true
  # Needs a reachable Route or a local proxy: PLAYWRIGHT_BASE_URL. The first run
  # also needs `npx playwright install chromium` in this workspace.
  - id: test-ui
    exec:
      component: node
      workingDir: ${PROJECT_SOURCE}/vm-cloud-native-demo/frontend
      commandLine: npx playwright test
      group:
        kind: test

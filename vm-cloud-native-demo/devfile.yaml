schemaVersion: 2.2.0
metadata:
  name: vm-cloud-native-demo
projects:
  - name: rh-demos
    git:
      remotes:
        origin: https://github.com/cldmnky/rh-demos.git
components:
  - name: go
    container:
      image: registry.access.redhat.com/ubi9/go-toolset:latest
      env:
        - name: GOPATH
          value: /tmp/go
        - name: GOCACHE
          value: /tmp/go-build
        # The che-code launcher binds CODE_HOST, defaulting to 127.0.0.1, which
        # no Route or workspace health check can reach. Dev Spaces injects the
        # editor into the first component, so it needs to listen on all
        # interfaces here. Without it the workspace fails its health check.
        - name: CODE_HOST
          value: 0.0.0.0
      command: ['tail', '-f', '/dev/null']
      memoryLimit: 2Gi
      mountSources: true
  - name: node
    container:
      image: registry.access.redhat.com/ubi9/nodejs-20:latest
      command: ['tail', '-f', '/dev/null']
      memoryLimit: 2Gi
      mountSources: true
      endpoints:
        # `npm run dev` binds 5173; without an endpoint the dev server is only
        # reachable from inside the workspace.
        - name: vite
          targetPort: 5173
          exposure: public
          protocol: http
  - name: openshift-cli
    container:
      image: quay.io/openshift/origin-cli:4.22
      memoryLimit: 1Gi
      mountSources: true
      command: ['tail', '-f', '/dev/null']
commands:
  - id: test-api
    exec:
      component: go
      workingDir: ${PROJECTS_ROOT}/rh-demos/vm-cloud-native-demo/backend
      commandLine: go test ./...
      group:
        kind: test
        isDefault: true
  - id: check-frontend
    exec:
      component: node
      workingDir: ${PROJECTS_ROOT}/rh-demos/vm-cloud-native-demo/frontend
      commandLine: npm ci && npm run typecheck
      group:
        kind: test
  - id: build-frontend
    exec:
      component: node
      workingDir: ${PROJECTS_ROOT}/rh-demos/vm-cloud-native-demo
      commandLine: ./scripts/build-frontend.sh
      group:
        kind: build
        isDefault: true
  # The workspace components share the project source: export
  # API_URL=<the orders-api Service or Route> before starting this command.
  - id: dev-frontend
    exec:
      component: node
      workingDir: ${PROJECTS_ROOT}/rh-demos/vm-cloud-native-demo/frontend
      commandLine: npm run dev -- --host 0.0.0.0
      group:
        kind: run
        isDefault: true
  # Needs a reachable Route or a local proxy: PLAYWRIGHT_BASE_URL. The first run
  # also needs `npx playwright install chromium` in this workspace.
  - id: test-ui
    exec:
      component: node
      workingDir: ${PROJECTS_ROOT}/rh-demos/vm-cloud-native-demo/frontend
      commandLine: npx playwright test
      group:
        kind: test

# MetalLB BGP service demo workload (Cluster 1).
#
# A plain web service on the default pod network exposed as a LoadBalancer.
# MetalLB assigns a VIP from its evpn-pool (applied by clusters-v2.sh) and the
# node's frr-k8s instance announces it over the existing iBGP session to the
# provider edge, which relays it via eBGP transit to the other site.
apiVersion: v1
kind: Namespace
metadata:
  name: l3-services
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: l3-services
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: registry.k8s.io/e2e-test-images/agnhost:2.66.1
          args:
            - netexec
            - --http-port=8080
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: l3-services
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - name: http
      port: 8080
      targetPort: 8080

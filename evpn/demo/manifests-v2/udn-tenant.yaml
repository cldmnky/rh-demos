# Act: "Normal" UDN — namespace-scoped UserDefinedNetwork (Layer3, Primary).
#
# Showcases OVN-Kubernetes network segmentation: a tenant owner creates a
# network inside their own namespace. Pods get their own subnet, isolated
# from the cluster default network and from every other UDN.
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-a
  labels:
    k8s.ovn.org/primary-user-defined-network: ""
---
apiVersion: k8s.ovn.org/v1
kind: UserDefinedNetwork
metadata:
  name: prod-net
  namespace: tenant-a
spec:
  topology: Layer3
  layer3:
    role: Primary
    subnets:
      - cidr: 103.103.0.0/16
        hostSubnet: 24
---
apiVersion: v1
kind: Pod
metadata:
  name: app-a
  namespace: tenant-a
spec:
  containers:
    - name: netexec
      image: registry.k8s.io/e2e-test-images/agnhost:2.66.1
      command: ["sleep", "infinity"]
  nodeSelector:
    kubernetes.io/hostname: evpn-cluster1-worker
